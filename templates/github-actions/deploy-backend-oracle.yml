name: Deploy Backend to Oracle

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy
        required: true
        type: choice
        options:
          - dev
          - production
  push:
    branches:
      - develop
      - main
    tags:
      - v*

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'develop' && 'dev' || 'production') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          IMAGE="${{ vars.GHCR_IMAGE }}"
          TAG="${GITHUB_SHA}"
          echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/oracle_deploy_key
          chmod 600 ~/.ssh/oracle_deploy_key
          ssh-keyscan -H "${{ vars.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Oracle host
        shell: bash
        env:
          ORACLE_HOST: ${{ vars.ORACLE_HOST }}
          ORACLE_USER: ${{ vars.ORACLE_USER }}
          ORACLE_APP_ID: ${{ vars.ORACLE_APP_ID }}
          IMAGE_REF: ${{ steps.meta.outputs.image }}
        run: |
          ssh -i ~/.ssh/oracle_deploy_key "${ORACLE_USER}@${ORACLE_HOST}" \
            "sudo /usr/local/sbin/deploy-oracle-app '${ORACLE_APP_ID}' '${IMAGE_REF}'"

      - name: Verify API health
        if: ${{ vars.ORACLE_API_DOMAIN != '' }}
        shell: bash
        env:
          ORACLE_API_DOMAIN: ${{ vars.ORACLE_API_DOMAIN }}
        run: |
          curl --fail --silent --show-error "https://${ORACLE_API_DOMAIN}/api/health"
